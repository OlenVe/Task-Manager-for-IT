{% extends "base.html" %}

{% block content %}
<style>
  .projects-container {
    min-height: 100vh;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .projects-table-wrapper {
    background-color: white;
    padding: 2rem;
    border-radius: 1rem;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 900px;
  }

  .table th, .table td {
    vertical-align: middle;
    text-align: center;
  }

  .btn-create {
    margin-bottom: 1rem;
    font-size: 0.875rem;
    border-radius: 0.5rem;
  }

  .btn-detail {
    background-color: #198754;
    color: white;
    text-decoration: none;
    padding: 0.375rem 0.75rem;
    font-size: 0.875rem;
    border-radius: 0.5rem;
  }

  .btn-detail:hover {
    background-color: #157347;
  }

  .btn-update,
  .btn-delete {
    padding: 0.375rem 0.75rem;
    font-size: 0.875rem;
    border-radius: 0.5rem;
  }

  .btn-update {
    background-color: #0d6efd;
    color: white;
    text-decoration: none;
  }

  .btn-update:hover {
    background-color: #0b5ed7;
  }

  .btn-delete {
    background-color: #dc3545;
    color: white;
    text-decoration: none;
  }

  .btn-delete:hover {
    background-color: #bb2d3b;
  }
</style>

<div class="projects-container">
  <div class="projects-table-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="mb-0">Project List</h2>
      <a href="{% url 'tasker:projects-create' %}" class="btn btn-primary btn-create">Create</a>
    </div>

    {% if project_list %}
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Name</th>
            <th>Detail</th>
            <th>Update</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody>
          {% for project in project_list %}
            <tr>
              <td>{{ project.name }}</td>
              <td>
                <a href="{% url 'tasker:projects-detail' pk=project.id %}" class="btn-detail">
                  Detail
                </a>
              </td>
              <td>
                <a href="{% url 'tasker:projects-update' pk=project.id %}" class="btn-update">
                  Update
                </a>
              </td>
              <td>
                <a href="{% url 'tasker:projects-delete' pk=project.id %}" class="btn-delete">
                  Delete
                </a>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="text-muted text-center mb-0">There are no projects in the service.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
