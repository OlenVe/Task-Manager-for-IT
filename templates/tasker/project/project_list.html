{% extends "base.html" %}

{% block content %}
<style>
  .projects-container {
    min-height: 100vh;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .projects-table-wrapper {
    background-color: white;
    padding: 2rem;
    border-radius: 1rem;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 900px;
  }

  .table th, .table td {
    vertical-align: middle;
  }

  .btn-create {
    margin-left: 1rem;
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    border-radius: 0.5rem;
  }

  .btn-update,
  .btn-delete {
    padding: 0.375rem 0.75rem;
    font-size: 0.875rem;
    border-radius: 0.5rem;
  }

  .btn-update {
    background-color: #0d6efd;
    color: white;
    text-decoration: none;
  }

  .btn-update:hover {
    background-color: #0b5ed7;
  }

  .btn-delete {
    background-color: #dc3545;
    color: white;
    text-decoration: none;
  }

  .btn-delete:hover {
    background-color: #bb2d3b;
  }

  .project-link {
    font-weight: 500;
    text-decoration: none;
    color: #0d6efd;
  }

  .project-link:hover {
    text-decoration: underline;
  }
</style>

<div class="projects-container">
  <div class="d-flex align-items-center mb-4">
    <h1 class="me-3">Project List</h1>
    <a href="{% url 'tasker:project-create' %}" class="btn btn-primary btn-create">Create</a>
  </div>

  <div class="projects-table-wrapper">
    {% if project_list %}
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Name</th>
            <th>Update</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody>
          {% for project in project_list %}
            <tr>
              <td>
                <a href="{% url 'tasker:project-detail' pk=project.id %}" class="project-link">
                  {{ project.name }}
                </a>
              </td>
              <td>
                <a href="{% url 'tasker:project-update' pk=project.id %}" class="btn-update">
                  Update
                </a>
              </td>
              <td>
                <a href="{% url 'tasker:project-delete' pk=project.id %}" class="btn-delete">
                  Delete
                </a>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="text-muted">There are no projects in the service.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
