{% extends "base.html" %}

{% block content %}
  <h1>Delete task: {{ object.name }}?</h1>
  <h2> {{ object.name }} has status {{ object.is_completed }}</h2>
  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn btn-danger">
    <a href="{% url "tasker:tasks-list" %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
