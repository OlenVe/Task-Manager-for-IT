{% extends "base.html" %}

{% block content %}
<div class="container py-5 d-flex justify-content-center">
  <div class="card shadow w-100" style="max-width: 800px;">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="card-title mb-0">Task Types</h2>
        <a href="{% url 'tasker:task-types-create' %}" class="btn btn-primary">
          + Create
        </a>
      </div>

      {% if task_type_list %}
        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Name</th>
                <th style="width: 90px;">Update</th>
                <th style="width: 90px;">Delete</th>
              </tr>
            </thead>
            <tbody>
              {% for task_type in task_type_list %}
                <tr>
                  <td>{{ task_type.name }}</td>
                  <td>
                    <a href="{% url 'tasker:task-types-update' pk=task_type.id %}" class="btn btn-sm btn-outline-secondary w-100">
                      Update
                    </a>
                  </td>
                  <td>
                    <a href="{% url 'tasker:task-types-delete' pk=task_type.id %}" class="btn btn-sm btn-outline-danger w-100">
                      Delete
                    </a>
                  </td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      {% else %}
        <p class="text-muted">There are no task types in the system.</p>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
