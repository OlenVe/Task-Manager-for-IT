{% extends "base.html" %}

{% block content %}
  <h1>
    Task Type List
    <a href="{% url 'tasker:task_type-create' %}" class="btn btn-primary link-to-page">
      Create
    </a>
  </h1>

  {% if task_type_list %}
    <table class="table">
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>

      {% for task_type in task_type_list %}
        <tr>
          <td>
              {{ task_type.name }}
          </td>
          <td>
              <a href="{% url 'tasker:task_type-update' pk=task_type.id %}">
                Update
              </a>
            </td>
            <td>
              <a style="color: red"
                href="{% url 'tasker:task_type-delete' pk=task_type.id %}">
                Delete
              </a>
            </td>
        </tr>
      {% endfor %}
    </table>

  {% else %}
      <p>There are no Task type in the service.</p>
  {% endif %}
{% endblock %}
