{% extends "base.html" %}

{% block content %}
  <h1>Delete task type with name: {{ object.name }}?</h1>
  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn btn-danger">
    <a href="{% url "tasker:task_type-list" %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
