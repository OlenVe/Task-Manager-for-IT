{% extends "base.html" %}

{% block content %}
<div class="container py-5 d-flex justify-content-center">
  <div class="card shadow w-100" style="max-width: 900px;">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="card-title mb-0">Teams</h2>
        <a href="{% url 'tasker:team-create' %}" class="btn btn-primary">
          + Create
        </a>
      </div>

      {% if team_list %}
        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
{#                <th style="width: 80px;">ID</th>#}
                <th>Name</th>
                <th style="width: 90px;">Update</th>
                <th style="width: 90px;">Delete</th>
              </tr>
            </thead>
            <tbody>
              {% for team in team_list %}
                <tr>
{#                  <td>{{ team.id }}</td>#}
                  <td>{{ team.name }}</td>
                  <td>
                    <a href="{% url 'tasker:team-update' pk=team.id %}" class="btn btn-sm btn-outline-secondary w-100">
                      Update
                    </a>
                  </td>
                  <td>
                    <a href="{% url 'tasker:team-delete' pk=team.id %}" class="btn btn-sm btn-outline-danger w-100">
                      Delete
                    </a>
                  </td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      {% else %}
        <p class="text-muted">There are no teams in the system.</p>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
